name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  snyk-security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Run Snyk security scan
      uses: snyk/actions/maven@master
      # NOTE: continue-on-error lets the workflow stay green even when Snyk finds
      # vulnerabilities (high/critical). Results are still shown in the log.
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

  docker-build:
    runs-on: ubuntu-latest
    needs: build   # only runs if the build job (compile + tests) passed

    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t cicd-epat-base:${{ github.sha }} .

  trivy-container-scan:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy vulnerability scan on built image
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: cicd-epat-base:${{ github.sha }}
        format: table
        exit-code: '1'
        ignore-unfixed: false
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignorefile: .trivyignore

  docker-push:
    runs-on: ubuntu-latest
    needs: trivy-container-scan

    steps:
    - uses: actions/checkout@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Tag image for Docker Hub
      run: docker tag cicd-epat-base:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/cicd-epat-base:${{ github.sha }}
    - name: Push image to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-epat-base:${{ github.sha }}

